name: Deploy
on:
  push:
    branches: [mainbranch, develop]
  workflow_dispatch:
    inputs:
      target:
        description: Environment
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: Type production for a manual production release
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: deploy-${{ inputs.target || (github.ref_name == 'mainbranch' && 'production' || 'staging') }}
  cancel-in-progress: false
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: ${{ (inputs.target == 'production' || (github.event_name == 'push' && github.ref_name == 'mainbranch')) && 'github-pages' || 'staging' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    # Allocation is serialized across environments because both share the registry.
    concurrency:
      group: release-registry
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target || (github.ref_name == 'mainbranch' && 'production' || 'staging') }}
      CONFIRM: ${{ inputs.confirm }}
      BEFORE: ${{ github.event.before }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROD_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
      PROD_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      STAGING_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      STAGING_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
      STAGING_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      PROD_URL: ${{ secrets.PROD_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      PROD_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_SITE_URL: ${{ vars.STAGING_SITE_URL || secrets.STAGING_SITE_URL }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'estate-inventory' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resolve environment and check deployment configuration
        id: config
        run: |
          set -euo pipefail
          if [ "$TARGET" = production ]; then
            [ "$GITHUB_REF_NAME" = mainbranch ] || { echo '::error::Production must use mainbranch.'; exit 1; }
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$CONFIRM" != production ]; then
              echo '::error::Type production to confirm a manual release.'; exit 1
            fi
            PROJECT_REF="$PROD_REF"; DB_PASSWORD="$PROD_PASSWORD"
            VITE_SUPABASE_URL="${PROD_URL:-$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.hosted)}"
            VITE_SUPABASE_ANON_KEY="${PROD_KEY:-$(sed -n 's/^VITE_SUPABASE_ANON_KEY=//p' .env.hosted)}"
            SITE_URL=https://redbaron13.github.io/estate-inventory/
            VITE_BASE=/estate-inventory/
          else
            PROJECT_REF="$STAGING_REF"; DB_PASSWORD="$STAGING_PASSWORD"
            VITE_SUPABASE_URL="$STAGING_URL"; VITE_SUPABASE_ANON_KEY="$STAGING_KEY"
            SITE_URL="$STAGING_SITE_URL"; VITE_BASE=/
            for name in PROJECT_REF DB_PASSWORD VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SITE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SUPABASE_ACCESS_TOKEN; do
              [ -n "${!name}" ] || { echo "::error::Missing staging configuration: $name. See docs/RELEASES.md."; exit 1; }
            done
            prod_url="${PROD_URL:-$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.hosted)}"
            staging_origin="$(node --input-type=module -e 'console.log(new URL(process.env.STAGING_URL).origin)')"
            production_origin="$(PRODUCTION_URL="$prod_url" node --input-type=module -e 'console.log(new URL(process.env.PRODUCTION_URL).origin)')"
            [ "$staging_origin" != "$production_origin" ] || { echo '::error::Staging cannot use the production database.'; exit 1; }
          fi
          [[ "$VITE_SUPABASE_URL" == https://* ]] && [ -n "$VITE_SUPABASE_ANON_KEY" ] || { echo '::error::Public client configuration is incomplete.'; exit 1; }
          deploy_backend=false
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ] && [ -n "$DB_PASSWORD" ]; then
            deploy_backend=true
          else
            SITE_URL="$SITE_URL" node scripts/check-backend-deploy.mjs
            echo '::notice::Frontend release. Backend credentials are not configured; existing API remains in use.'
          fi
          echo "backend=$deploy_backend" >> "$GITHUB_OUTPUT"
          # Only public client values belong in GITHUB_ENV. Passwords stay step-local.
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_ANON_KEY=$VITE_SUPABASE_ANON_KEY"
            echo "VITE_API_URL=${VITE_SUPABASE_URL%/}/functions/v1/api/v1"
            echo "SITE_URL=$SITE_URL"
            echo "VITE_BASE=$VITE_BASE"
            echo "RELEASE_ENV=$TARGET"
          } >> "$GITHUB_ENV"
      - name: Reserve a globally unique release identity
        id: identity
        run: node scripts/reserve-release.mjs
        env:
          RELEASE_KEY: ${{ github.run_id }}:${{ env.TARGET }}:WB:x3
      - name: Build the installable and browser app
        run: npm run build
        env:
          RELEASE_PREPARED: 'true'
          VITE_APP_ENV: ${{ env.TARGET }}
      - name: Install Supabase CLI
        if: steps.config.outputs.backend == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 2.120.0
      - name: Migrate database and deploy API before publishing the app
        if: steps.config.outputs.backend == 'true'
        run: |
          set -euo pipefail
          if [ "$TARGET" = production ]; then
            PROJECT_REF="$PROD_REF"; DB_PASSWORD="$PROD_PASSWORD"
          else
            PROJECT_REF="$STAGING_REF"; DB_PASSWORD="$STAGING_PASSWORD"
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --dry-run --password "$DB_PASSWORD"
          supabase db push --yes --password "$DB_PASSWORD"
          node scripts/configure-deploy.mjs
          origin="$(node --input-type=module -e 'console.log(new URL(process.env.SITE_URL).origin)')"
          supabase secrets set --project-ref "$PROJECT_REF" ALLOWED_ORIGINS="$origin"
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Verify the retired administrator reset RPC is absent
        if: steps.config.outputs.backend == 'true'
        run: node scripts/verify-auth-boundary.mjs
      - name: Prepare GitHub Pages
        if: env.TARGET == 'production'
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          rm -f dist/_headers
      - name: Keep the exact release for download and rollback
        uses: actions/upload-artifact@v7
        with:
          name: estate-${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.id }}
          path: dist/
          retention-days: 90
      - name: Upload the production Pages artifact
        if: env.TARGET == 'production'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/
      - name: Publish production from the approved source branch
        if: env.TARGET == 'production'
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish staging
        if: env.TARGET == 'staging'
        run: npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch staging --commit-hash "$GITHUB_SHA" --commit-dirty=true
      - name: Verify the exact published release and backend health
        env:
          EXPECTED_ID: ${{ steps.identity.outputs.id }}
        run: |
          set -euo pipefail
          matched=false
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 20 "${SITE_URL%/}/release.json?run=$GITHUB_RUN_ID" -o /tmp/published-release.json &&
              node --input-type=module -e 'import fs from "node:fs"; const r=JSON.parse(fs.readFileSync("/tmp/published-release.json")); if(r.id !== process.env.EXPECTED_ID || r.commit !== process.env.GITHUB_SHA) process.exit(1)'; then
              matched=true; break
            fi
            sleep 10
          done
          [ "$matched" = true ] || { echo '::error::The published release did not match this build.'; exit 1; }
          curl -fsS --max-time 30 "$VITE_API_URL/health" | node --input-type=module -e 'let s=""; for await(const c of process.stdin)s+=c; if(JSON.parse(s).ok!==true)process.exit(1)'
          {
            echo "### Released ${{ steps.identity.outputs.version }} / $EXPECTED_ID"
            echo "- Environment: $TARGET"
            echo "- Open: $SITE_URL"
            echo "- Install: open More > Install on this device"
            echo "- Exact release manifest and API health verified"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-release:
    if: ${{ inputs.target == 'production' || (github.event_name == 'push' && github.ref_name == 'mainbranch') }}
    needs: [ci, release]
    uses: ./.github/workflows/macos-release.yml
    secrets: inherit
    permissions:
      contents: write
