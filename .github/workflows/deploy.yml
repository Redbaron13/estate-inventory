# Release pipeline.
#
#   push to mainbranch ->  full CI  ->  staging   (only if a staging project is configured)
#   manual run    ->  full CI  ->  staging or production
#
# Production deploys are always manual: Actions > Deploy > Run workflow,
# choose "production" and type the word production to confirm. Order matters
# and is fixed: database migrations (forward only), auth settings, the API
# function, then the app. The phone picks up the new app version and shows
# "A new version is ready" (nothing in progress is interrupted).
#
# Secrets (repository secrets, or secrets in the github-pages environment; names are prefixed). See docs/PIPELINE.md.
name: Deploy

on:
  push:
    branches: [mainbranch]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: To deploy to production, type the word production
        required: false
      reset_password_flag:
        description: Flag to reset temporary password for kevinbaron13@gmail.com
        type: boolean
        default: false

concurrency:
  group: deploy-${{ inputs.target || 'staging' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  # The app on GitHub Pages (https://redbaron13.github.io/estate-inventory/),
  # pointed at the hosted Supabase project (.env.hosted). Runs on every push
  # to mainbranch once all tests pass.
  pages:
    needs: ci
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.confirm == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://redbaron13.github.io/estate-inventory/
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pages preflight diagnostics
        env:
          PAGES_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.PROD_SUPABASE_URL || vars.VITE_SUPABASE_URL || '' }}
          PAGES_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || '' }}
          PAGES_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || '' }}
        run: |
          set -euo pipefail
          echo "::group::GitHub Pages build context"
          echo "Ref: ${GITHUB_REF_NAME}"
          echo "Commit: ${GITHUB_SHA}"
          echo "Runner Node: $(node --version)"
          echo "Hosted environment file present: $([ -f .env.hosted ] && echo yes || echo no)"
          echo "::endgroup::"

          if [ ! -f .env.hosted ]; then
            echo "::error::Missing .env.hosted and Pages client configuration cannot be resolved."
            exit 1
          fi
          hosted_value() { sed -n "s/^$1=//p" .env.hosted | head -n 1; }
          supabase_url="${PAGES_SUPABASE_URL:-$(hosted_value VITE_SUPABASE_URL)}"
          publishable_key="${PAGES_SUPABASE_ANON_KEY:-$(hosted_value VITE_SUPABASE_ANON_KEY)}"
          api_url="${PAGES_API_URL:-$(hosted_value VITE_API_URL)}"
          if [ -z "$api_url" ] && [ -n "$supabase_url" ]; then
            api_url="${supabase_url%/}/functions/v1/api/v1"
          fi
          echo "Supabase URL configured: $([ -n "$supabase_url" ] && echo yes || echo no)"
          echo "Publishable client key configured: $([ -n "$publishable_key" ] && echo yes || echo no)"
          echo "API endpoint configured: $([ -n "$api_url" ] && echo yes || echo no)"
          if [[ ! "$supabase_url" =~ ^https:// ]] || [[ ! "$api_url" =~ ^https:// ]] || [ -z "$publishable_key" ]; then
            echo "::error::Pages configuration is incomplete. Set the public Supabase URL, publishable key, and API endpoint in .env.hosted or repository variables."
            exit 1
          fi
      - name: Build for GitHub Pages
        run: |
          set -Eeuo pipefail
          trap 'status=$?; echo "::error::GitHub Pages build failed (exit ${status}). Review TypeScript and Vite output above."; exit "$status"' ERR
          npx tsc -b
          [ -n "${PAGES_SUPABASE_URL}" ] && export VITE_SUPABASE_URL="${PAGES_SUPABASE_URL}"
          [ -n "${PAGES_SUPABASE_ANON_KEY}" ] && export VITE_SUPABASE_ANON_KEY="${PAGES_SUPABASE_ANON_KEY}"
          [ -n "${PAGES_API_URL}" ] && export VITE_API_URL="${PAGES_API_URL}"
          if [ "${RESET_PASSWORD_FLAG}" = "true" ]; then export VITE_RESET_PASSWORD_FLAG="true"; fi
          VITE_CSP_META=1 VITE_BASE=/estate-inventory/ VITE_APP_VERSION=${GITHUB_SHA::7} npx vite build --mode hosted --outDir dist-pages
          cp dist-pages/index.html dist-pages/404.html
          touch dist-pages/.nojekyll
          rm -f dist-pages/_headers
          for artifact in index.html 404.html manifest.webmanifest sw.js; do
            if [ ! -s "dist-pages/${artifact}" ]; then
              echo "::error::Required Pages artifact is missing or empty: ${artifact}"
              exit 1
            fi
          done
          echo "Pages artifact size: $(du -sh dist-pages | cut -f1)"
          echo "Verified: index.html, 404.html, manifest.webmanifest, sw.js"
        env:
          PAGES_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.PROD_SUPABASE_URL || vars.VITE_SUPABASE_URL || '' }}
          PAGES_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.PROD_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || '' }}
          PAGES_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || '' }}
          RESET_PASSWORD_FLAG: ${{ inputs.reset_password_flag || vars.RESET_PASSWORD_FLAG || vars.VITE_RESET_PASSWORD_FLAG || 'false' }}
      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist-pages
          publish_branch: gh-pages
          force_orphan: true
          commit_message: Publish app build
      - name: Verify published app and API
        env:
          PAGES_URL: https://redbaron13.github.io/estate-inventory/
          PAGES_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL || '' }}
        run: |
          set -euo pipefail
          body="$(mktemp)"
          health="$(mktemp)"
          trap 'rm -f "$body" "$health"' EXIT
          status=000
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o "$body" -w '%{http_code}' "$PAGES_URL" || true)"
            if [ "$status" = 200 ]; then break; fi
            echo "Pages smoke check attempt ${attempt}/12 returned HTTP ${status}."
            sleep 5
          done
          if [ "$status" != 200 ] || ! grep -q 'id="root"' "$body"; then
            echo "::error::Published Pages site did not return the expected app shell (HTTP ${status})."
            exit 1
          fi
          api_url="${PAGES_API_URL:-$(sed -n 's/^VITE_API_URL=//p' .env.hosted | head -n 1)}"
          if [ -z "$api_url" ]; then
            supabase_url="$(sed -n 's/^VITE_SUPABASE_URL=//p' .env.hosted | head -n 1)"
            api_url="${supabase_url%/}/functions/v1/api/v1"
          fi
          health_status="$(curl --silent --show-error --connect-timeout 10 --max-time 30 -o "$health" -w '%{http_code}' "${api_url%/}/health" || true)"
          if [ "$health_status" != 200 ] || ! node -e 'const v=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(v.ok !== true) process.exit(1)' "$health"; then
            echo "::error::Configured API health check failed (HTTP ${health_status}). Verify the API URL, deployment, and hosted credentials."
            exit 1
          fi
          # The CDN can serve the previous build for a short while, so retry.
          for attempt in 1 2 3 4 5 6; do
            if ALLOW_META_CSP=1 node scripts/verify-headers.mjs "$PAGES_URL"; then break; fi
            if [ "$attempt" = 6 ]; then exit 1; fi
            sleep 10
          done
          echo "### GitHub Pages deployment verification" >> "$GITHUB_STEP_SUMMARY"
          echo "- App shell: HTTP ${status}, root element found" >> "$GITHUB_STEP_SUMMARY"
          echo "- API health: HTTP ${health_status}, healthy response" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${PAGES_URL}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Same environment as the pages job, so secrets stored there are visible here too.
    environment: github-pages
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.target == 'production' && secrets.PROD_SUPABASE_PROJECT_REF || secrets.STAGING_SUPABASE_PROJECT_REF }}
      DB_PASSWORD: ${{ inputs.target == 'production' && secrets.PROD_SUPABASE_DB_PASSWORD || secrets.STAGING_SUPABASE_DB_PASSWORD }}
      VITE_SUPABASE_URL: ${{ inputs.target == 'production' && secrets.PROD_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ inputs.target == 'production' && secrets.PROD_SUPABASE_ANON_KEY || secrets.STAGING_SUPABASE_ANON_KEY }}
      SITE_URL: ${{ inputs.target == 'production' && secrets.PROD_SITE_URL || secrets.STAGING_SITE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.PAGES_PROJECT || 'estate-inventory' }}
      SUPABASE_CLI_VERSION: 2.120.0
    steps:
      - name: Check target and configuration
        id: gate
        run: |
          if [ "$TARGET" = "production" ] && [ "${{ inputs.confirm }}" != "production" ]; then
            echo "::error::To deploy to production, type the word production in the confirm box."; exit 1
          fi
          if [ -z "$PROJECT_REF" ]; then
            if [ "$TARGET" = "staging" ]; then
              echo "No staging project configured (STAGING_SUPABASE_PROJECT_REF). Skipping the automatic staging deploy."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            echo "::error::PROD_SUPABASE_PROJECT_REF is not set."; exit 1
          fi
          for v in SUPABASE_ACCESS_TOKEN DB_PASSWORD VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY SITE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v ($TARGET). See docs/PIPELINE.md."; exit 1; fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - if: steps.gate.outputs.skip != 'true'
        uses: supabase/setup-cli@v3
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Database migrations (forward only, never the demo seed)
        if: steps.gate.outputs.skip != 'true'
        run: |
          supabase link --project-ref "$PROJECT_REF" --password "$DB_PASSWORD"
          supabase db push --dry-run --password "$DB_PASSWORD"
          supabase db push --yes --password "$DB_PASSWORD"

      - name: Auth settings (sign-in codes, templates, redirect URLs)
        if: steps.gate.outputs.skip != 'true'
        run: supabase config push --project-ref "$PROJECT_REF" --yes

      - name: API function
        if: steps.gate.outputs.skip != 'true'
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" ALLOWED_ORIGINS="$SITE_URL"
          supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt

      - name: Build the app
        if: steps.gate.outputs.skip != 'true'
        run: npm run build
        env:
          VITE_APP_ENV: ${{ env.TARGET }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Publish to Cloudflare Pages
        if: steps.gate.outputs.skip != 'true'
        run: |
          BRANCH=$([ "$TARGET" = "production" ] && echo "${GITHUB_REF_NAME:-mainbranch}" || echo staging)
          npx wrangler pages project create "$PAGES_PROJECT" --production-branch mainbranch 2>/dev/null || true
          npx wrangler pages deploy dist --project-name "$PAGES_PROJECT" --branch "$BRANCH" --commit-hash "$GITHUB_SHA" --commit-dirty=true

      - name: Smoke test
        if: steps.gate.outputs.skip != 'true'
        run: |
          curl -fsS "$VITE_SUPABASE_URL/functions/v1/api/v1/health"
          curl -fsS -o /dev/null "$SITE_URL"
          node scripts/verify-headers.mjs "$SITE_URL"
          echo "### Deployed to $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "- App: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
